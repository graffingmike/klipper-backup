[gcode_macro START_PRINT]
gcode:
    RESET_LAYER_PAUSES
  G92 E0 ; Reset Extruder
  G28 ; Home all axes
  {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
  M140 S{BED_TEMP} ; Start bed heating
  M104 S150 ; Preheat nozzle to 150 to prevent ooze during mesh
  M190 S{BED_TEMP} ; Wait for bed
  BED_MESH_CALIBRATE ADAPTIVE=1 ; Mesh at 150C before full heat
  M104 S{EXTRUDER_TEMP} ; Now heat to print temp
  M109 S{EXTRUDER_TEMP} ; Wait for print temp
  G92 E0
  G1 E-2 F3600
  G1 Z2.0 F3000
  G1 X0.1 Y20 Z0.3 F5000.0
  G1 X0.1 Y200.0 Z0.3 F1500.0 E15 ; Draw the first line
  G1 X0.4 Y200.0 Z0.3 F5000.0
  G1 X0.4 Y20.0 Z0.3 F1500.0 E30 ; Draw the second line
  G92 E0 ; Reset Extruder
  G1 X0.4 Y15 Z0.3 F8000.0 ; Wipe pass 1
  G1 X0.1 Y15 Z0.3 F8000.0 ; Wipe pass 2
  G1 X0.4 Y15 Z0.3 F8000.0 ; Wipe pass 3
  G1 X0.1 Y15 Z0.3 F8000.0 ; Wipe pass 4
  G1 X0.4 Y15 Z0.3 F8000.0 ; Wipe pass 5
  G1 X0.1 Y15 Z0.3 F8000.0 ; Wipe pass 6
  G1 Z2.0 F3000 ; Lift nozzle
  G1 X5 Y20 F5000.0 ; Move clear

[gcode_macro END_PRINT]
gcode:
    M140 S0
    M104 S0
    M106 S0
    G91
    G1 X-2 Y-2 E-3 F300
    G1 Z20 F3000
    G90
    G1 Y230 F3000
    M84

[gcode_macro FILAMENT_CHANGE]
description: Pause print, park nozzle and prepare for filament change
gcode:
  PAUSE
  M117 Changing Filament...
  G91
  G1 Z10 F1000
  G90
  G1 X10 Y220 F10000
  M104 S0
  M140 S0
  M106 S0

[gcode_macro FILAMENT_CHANGE_LOAD]
description: Resume after filament change
gcode:
  M117 Resuming print...
  M104 S{params.EXTRUDER_TEMP|default(200)}
  M140 S{params.BED_TEMP|default(60)}
  M109 S{params.EXTRUDER_TEMP|default(200)}
  M190 S{params.BED_TEMP|default(60)}
  RESUME

[gcode_macro BABYSTEP_Z_UP]
gcode:
  M290 Z0.05

[gcode_macro BABYSTEP_Z_DOWN]
gcode:
  M290 Z-0.05

[gcode_macro PRESSURE_ADVANCE_TUNE_START]
description: Prepare printer for pressure advance tuning moves
gcode:
  M117 Pressure Advance Tuning Start
  SET_PRESSURE_ADVANCE ADVANCE=0
  G28
  G1 Z5 F6000

[gcode_macro PRESSURE_ADVANCE_TUNE_SET]
description: Set pressure advance during tuning
gcode:
  {% if 'ADVANCE' in params %}
    SET_PRESSURE_ADVANCE ADVANCE={params.ADVANCE}
    M117 Pressure Advance set to {params.ADVANCE}
  {% else %}
    M117 Please provide ADVANCE parameter
  {% endif %}

[gcode_macro PRESSURE_ADVANCE_TUNE_END]
description: End pressure advance tuning
gcode:
  M117 Pressure Advance Tuning Complete

[gcode_macro RESET_LAYER_PAUSES]
description: Hard-disable any layer pause toggles
gcode:
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

[gcode_macro M600]
description: Filament change
gcode:
  FILAMENT_CHANGE

[gcode_macro LOAD_FILAMENT]
description: Heat and load filament
gcode:
  {% set temp = params.TEMP|default(200)|int %}
  M109 S{temp}
  M83
  G1 E50 F300
  G1 E30 F150
  M82

[gcode_macro UNLOAD_FILAMENT]
description: Heat and unload filament
gcode:
  {% set temp = params.TEMP|default(200)|int %}
  M109 S{temp}
  M83
  G1 E5 F150
  G1 E-80 F300
  M82

[gcode_macro PARK]
description: Park the toolhead
gcode:
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 X117.5 Y220 Z50 F6000

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA
gcode:
  M140 S60
  M104 S200

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG
gcode:
  M140 S80
  M104 S230

[gcode_macro PREHEAT_ABS]
description: Preheat for ABS
gcode:
  M140 S100
  M104 S240

[gcode_macro CALIBRATE_Z_HOT]
description: Heat to print temps then run PROBE_CALIBRATE for accurate z-offset
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  M140 S{BED_TEMP}
  M109 S{EXTRUDER_TEMP}
  G28
  G1 Z5 F3000
  M190 S{BED_TEMP}
  PROBE_CALIBRATE

[gcode_macro BACKUP]
description: Backup config to GitHub
gcode:
  RUN_SHELL_COMMAND CMD=backup_cfg

[gcode_macro FILAMENT_RUNOUT]
description: Handle filament runout - retract, park and alert
gcode:
  M117 Filament runout detected!
  M300 S1000 P500
  PAUSE
  G91
  G1 E-5 F300
  G90

[gcode_macro SENSOR_ENABLE]
description: Enable filament runout sensor
gcode:
  SET_FILAMENT_SENSOR SENSOR=btt_smartie ENABLE=1
  M117 Filament sensor enabled

[gcode_macro SENSOR_DISABLE]
description: Disable filament runout sensor
gcode:
  SET_FILAMENT_SENSOR SENSOR=btt_smartie ENABLE=0
  M117 Filament sensor disabled

[gcode_macro CLEAN_NOZZLE]
description: Park nozzle at front-left for cleaning, then resume returns to print position
gcode:
  {% if printer.pause_resume.is_paused %}
    M117 Clean nozzle then press Resume...
    SAVE_GCODE_STATE NAME=clean_state
    G90
    G1 Z{[printer.toolhead.position.z + 20, 230]|min} F3000
    G1 X5 Y5 F9000
    M117 Nozzle ready to clean - press Resume when done
  {% else %}
    PAUSE
    M117 Clean nozzle then press Resume...
    SAVE_GCODE_STATE NAME=clean_state
    G90
    G1 Z{[printer.toolhead.position.z + 20, 230]|min} F3000
    G1 X5 Y5 F9000
    M117 Nozzle ready to clean - press Resume when done
  {% endif %}

[gcode_macro WIPE_BEFORE_RESUME]
description: Wipe nozzle on purge line then return to print position
gcode:
  G90
  G1 Z{[printer.toolhead.position.z + 5, 230]|min} F3000
  G1 X0.1 Y15 F9000
  G1 X0.4 Y15 F8000
  G1 X0.1 Y15 F8000
  G1 X0.4 Y15 F8000
  G1 X0.1 Y15 F8000
  RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=100
