
[include shell_command.cfg]
# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

[include macros.cfg]
[include mainsail.cfg]
[include /home/pi/moonraker-timelapse/klipper_macro/timelapse.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 250
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 250
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -2

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
#control: pid    # TEMP; run PID_CALIBRATE HEATER=extruder TARGET=200 then SAVE_CONFIG
#pid_Kp: 22.2    # TEMP; run PID_CALIBRATE to tune
#pid_Ki: 1.08    # TEMP; run PID_CALIBRATE to tune
#pid_Kd: 114.0    # TEMP; run PID_CALIBRATE to tune
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 22.67
nozzle_diameter: 0.400
pressure_advance: 0.28
pressure_advance_smooth_time: 0.020
full_steps_per_rotation: 200
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_kp: 21.527
#pid_ki: 1.063
#pid_kd: 108.982
min_temp: 5
max_temp: 250
max_extrude_only_distance: 100
[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 0

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -40
y_offset: -30
#z_offset: 0.0    # TEMP value; run PROBE_CALIBRATE then SAVE_CONFIG

probe_with_touch_mode: True

[safe_z_home]
home_xy_position: 157.5, 147.5
z_hop: 10

[heater_bed]
heater_pin: PC9
#control: pid    # TEMP; run PID_CALIBRATE HEATER=heater_bed TARGET=60 then SAVE_CONFIG
#pid_Kp: 70.0    # TEMP; run PID_CALIBRATE to tune
#pid_Ki: 1.10    # TEMP; run PID_CALIBRATE to tune
#pid_Kd: 800.0    # TEMP; run PID_CALIBRATE to tune
sensor_type: Generic 3950
sensor_pin: PC4
#control: pid
#pid_kp: 54.027
#pid_ki: 0.770
#pid_kd: 948.182
min_temp: 5
max_temp: 130
[heater_fan nozzle_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_470050000350415339373620-if00

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 15, 15
mesh_max: 200, 200
probe_count: 3,5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[screws_tilt_adjust]
screw3: 74, 42
screw3_name: Front left
screw4: 245, 42
screw4_name: Front right
screw2: 245, 213
screw2_name: Back right
screw1: 74, 213
screw1_name: Back left
screw_thread: CW-M4
horizontal_move_z: 10

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[filament_motion_sensor btt_smartie]
detection_length: 12.0
pause_on_runout: True
extruder: extruder
switch_pin: !PC15
runout_gcode: FILAMENT_RUNOUT
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[gcode_macro RETRACTION_TEST]
description: Run retraction calibration test
gcode:
    {% set length = params.LENGTH|default(5)|float %}
    {% set speed = params.SPEED|default(35)|float %}
    {% set retract = params.RETRACT|default(0.8)|float %}
    {% set unretract = params.UNRETRACT|default(0.8)|float %}
    
    M117 Retraction Test...
    G91 ; Relative positioning
    G1 E-{retract} F{speed * 60}
    G1 E{unretract} F{speed * 60}
    G90 ; Back to absolute
    M117 Done

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[pause_resume]
recover_velocity: 50

[exclude_object]

[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 3600

[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor: "filament_motion_sensor btt_smartie"
variable_user_pause_macro: "SAVE_GCODE_STATE NAME=PAUSE_STATE"
variable_user_resume_macro: "WIPE_BEFORE_RESUME"
variable_use_custom_pos: True
variable_custom_park_x: 10.0
variable_custom_park_y: 220.0
variable_custom_park_dz: 10.0
variable_park_at_cancel: True
variable_park_at_cancel_x: 10.0
variable_park_at_cancel_y: 220.0
